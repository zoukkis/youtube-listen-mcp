[project]
name = "youtube-listen-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants read YouTube transcripts and transcribe audio with Whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
# av 19 removed the open(metadata_errors=) argument that faster-whisper uses
# nvidia-* wheels supply the CUDA 12 cuBLAS/cuDNN 9 libraries CTranslate2 needs on GPU
whisper = [
    "faster-whisper>=1.0",
    "av<19",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]

[project.scripts]
youtube-listen-mcp = "youtube_listen_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_listen_mcp"]
