[project]
name = "youtube-listen-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants read YouTube transcripts and transcribe audio with Whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
youtube-listen-mcp = "youtube_listen_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_listen_mcp"]
